<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine Flopper 💗🐟</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Will you be my Valentine? 💘</h1>
    <p>Two Floppers. One answer. Don’t break my fishy heart 🐟💗</p>

    <!-- Upload your image into Replit Files and name it flopper.png -->
    <img class="flopper-img" src="flopper.png" alt="Valentine Flopper Fish" />

    <div class="heart-ring">💗 💗 💗 💗 💗</div>

    <div class="buttons">
      <button class="yes-button" id="yesBtn">YES 💖</button>
      <button class="no-button" id="noBtn">no</button>
    </div>
  </div>

  <div class="overlay" id="yesOverlay">
    <div class="card">
      <h2>YAYYYY 💞</h2>
      <p>
        You are officially my Valentine 🥰<br/>
        Flopper Fish approves. Hearts forever. 💗🐟💗
      </p>
      <button class="close-button" id="closeOverlay">OKAYYY 💗</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
